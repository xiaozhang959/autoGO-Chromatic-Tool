name: Build and Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "发布标签，例如 v1.0.5"
        required: true
        type: string
      prerelease:
        description: "是否标记为预发布"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

env:
  APP_NAME: AutoGo图色助手
  APP_ID: com.autogo.imagetool
  ICON_PATH: build/logo.png
  LDFLAGS: -s -w

jobs:
  metadata:
    name: Prepare release metadata
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      version: ${{ steps.meta.outputs.version }}
      build: ${{ steps.meta.outputs.build }}
    steps:
      - name: Resolve tag and version
        id: meta
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            tag="${{ inputs.tag }}"
          else
            tag="${{ github.ref_name }}"
          fi

          if [[ ! "$tag" =~ ^v[0-9]+(\.[0-9]+){0,2}$ ]]; then
            echo "Release tag must be vMAJOR, vMAJOR.MINOR, or vMAJOR.MINOR.PATCH, got: $tag" >&2
            exit 1
          fi

          version="${tag#v}"
          build="${{ github.run_number }}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "build=$build" >> "$GITHUB_OUTPUT"

  build-windows:
    name: Build Windows amd64
    runs-on: windows-latest
    needs: metadata
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: |
            go.sum
            fyne-master/go.sum

      - name: Setup MSYS2 MinGW toolchain
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-make

      - name: Add Go tools to PATH
        shell: pwsh
        run: |
          $goBin = Join-Path (go env GOPATH) "bin"
          Add-Content -Path $env:GITHUB_PATH -Value $goBin

      - name: Install Windows resource tool
        shell: pwsh
        run: go install github.com/akavel/rsrc@latest

      - name: Package Windows OpenCV app
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $env:PATH = "C:\msys64\ucrt64\bin;$env:PATH"
          $env:CGO_ENABLED = "1"
          $env:GOOS = "windows"
          $env:GOARCH = "amd64"
          $env:CC = "gcc"

          New-Item -ItemType Directory -Force -Path dist\windows | Out-Null
          $resourceFile = "rsrc_windows_amd64.syso"
          $iconFile = "build\logo.ico"
          $windowsExe = "dist\windows\$env:APP_NAME.exe"

          if (!(Test-Path $iconFile)) {
            throw "Windows icon file was not found: $iconFile"
          }

          try {
            rsrc -ico $iconFile -manifest "windows_icon.manifest" -arch amd64 -o $resourceFile
            if (!(Test-Path $resourceFile)) {
              throw "Windows resource file was not generated: $resourceFile"
            }

            powershell -ExecutionPolicy Bypass `
              -File ".\scripts\build_with_static_opencv_windows.ps1" `
              -Output $windowsExe `
              -BuildOpenCVIfMissing `
              -GoLdFlags "$env:LDFLAGS -H windowsgui"
          } finally {
            Remove-Item $resourceFile -ErrorAction SilentlyContinue
          }

          if (!(Test-Path $windowsExe)) {
            throw "Windows executable was not generated."
          }

          $iconCheckCode = @"
          using System;
          using System.Runtime.InteropServices;
          public static class ReleaseIconCheck {
            [DllImport("shell32.dll", CharSet = CharSet.Unicode, EntryPoint="ExtractIconExW")]
            public static extern uint ExtractIconEx(string file, int index, IntPtr[] large, IntPtr[] small, uint icons);
          }
          "@
          Add-Type -TypeDefinition $iconCheckCode
          $embeddedIconCount = [ReleaseIconCheck]::ExtractIconEx((Resolve-Path $windowsExe).Path, -1, $null, $null, 0)
          if ($embeddedIconCount -lt 1) {
            throw "Windows executable does not contain an embedded icon."
          }
          Write-Host "Embedded icon count: $embeddedIconCount"

          Copy-Item `
            -Path $windowsExe `
            -Destination "dist\AutoGo-Chromatic-Tool-windows-amd64.exe" `
            -Force

          Compress-Archive `
            -Path "dist\AutoGo-Chromatic-Tool-windows-amd64.exe" `
            -DestinationPath "dist\AutoGo-Chromatic-Tool-windows-amd64.zip" `
            -Force

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-amd64
          path: |
            dist/AutoGo-Chromatic-Tool-windows-amd64.exe
            dist/AutoGo-Chromatic-Tool-windows-amd64.zip
          if-no-files-found: error
          compression-level: 0

  build-macos:
    name: Build macOS ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    needs: metadata
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-14
          - arch: amd64
            runner: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: |
            go.sum
            fyne-master/go.sum

      - name: Add Go tools to PATH
        shell: bash
        run: echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Ensure CMake is available
        shell: bash
        run: |
          if ! command -v cmake >/dev/null 2>&1; then
            brew update
            brew install cmake
          fi

      - name: Install Fyne CLI from repository
        working-directory: fyne-master
        shell: bash
        run: go install ./cmd/fyne

      - name: Package macOS apps
        shell: bash
        env:
          VERSION: ${{ needs.metadata.outputs.version }}
          BUILD_NUMBER: ${{ needs.metadata.outputs.build }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          mkdir -p dist/macos

          tmp_dir="dist/macos/$ARCH"
          mkdir -p "$tmp_dir"
          bash scripts/build_with_static_opencv_macos.sh \
            --output "$tmp_dir/autogo" \
            --arch "$ARCH" \
            --build-opencv-if-missing \
            --ldflags "$LDFLAGS"

          if otool -L "$tmp_dir/autogo" | grep -E "opencv|libstdc\+\+|libgcc"; then
            echo "Unexpected non-system OpenCV/GNU runtime dylib dependency in macOS executable" >&2
            exit 1
          fi

          rm -rf "$APP_NAME.app"
          fyne package \
            -os darwin \
            -executable "$tmp_dir/autogo" \
            -name "$APP_NAME" \
            -icon "$ICON_PATH" \
            -appID "$APP_ID" \
            -appVersion "$VERSION" \
            -appBuild "$BUILD_NUMBER" \
            -release

          app_dir="dist/macos/$APP_NAME-macos-$ARCH.app"
          rm -rf "$app_dir"
          mv "$APP_NAME.app" "$app_dir"
          ditto -c -k --sequesterRsrc --keepParent \
            "$app_dir" \
            "dist/AutoGo-Chromatic-Tool-macos-$ARCH.zip"

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}
          path: dist/AutoGo-Chromatic-Tool-macos-${{ matrix.arch }}.zip
          if-no-files-found: error
          compression-level: 0

  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs:
      - metadata
      - build-windows
      - build-macos
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ needs.metadata.outputs.tag }}

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.metadata.outputs.tag }}
          RELEASE_VERSION: ${{ needs.metadata.outputs.version }}
          PRERELEASE: ${{ github.event_name == 'workflow_dispatch' && inputs.prerelease || false }}
        run: |
          set -euo pipefail
          find release-assets -maxdepth 1 -type f -print

          release_commit="$(git rev-list -n 1 "$RELEASE_TAG")"
          short_sha="$(git rev-parse --short "$release_commit")"
          tag_message_file="tag-message.md"
          tag_type="$(git cat-file -t "refs/tags/$RELEASE_TAG" 2>/dev/null || true)"
          if [ "$tag_type" = "tag" ]; then
            git for-each-ref "refs/tags/$RELEASE_TAG" --format='%(contents)' > "$tag_message_file"
          else
            : > "$tag_message_file"
          fi

          cat > release-notes.md <<EOF
          自动构建发布 $RELEASE_VERSION。

          EOF

          if [ -s "$tag_message_file" ]; then
            cat "$tag_message_file" >> release-notes.md
            printf "\n\n" >> release-notes.md
          else
            cat >> release-notes.md <<EOF
          更新说明未在 tag message 中提供。
          使用示例：git tag -a $RELEASE_TAG -m "发布说明"

          EOF
          fi

          cat >> release-notes.md <<EOF
          版本信息：
          - Tag: $RELEASE_TAG
          - Commit: $short_sha
          - Build: $GITHUB_RUN_NUMBER

          包含文件：
          - AutoGo-Chromatic-Tool-windows-amd64.exe
          - AutoGo-Chromatic-Tool-windows-amd64.zip
          - AutoGo-Chromatic-Tool-macos-arm64.zip
          - AutoGo-Chromatic-Tool-macos-amd64.zip
          EOF

          prerelease_flag=()
          if [ "$PRERELEASE" = "true" ]; then
            prerelease_flag+=(--prerelease)
          fi

          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "$RELEASE_TAG" \
              --notes-file release-notes.md
            gh release upload "$RELEASE_TAG" release-assets/* --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$RELEASE_TAG" release-assets/* \
              --repo "$GITHUB_REPOSITORY" \
              --title "$RELEASE_TAG" \
              --notes-file release-notes.md \
              --target "$release_commit" \
              "${prerelease_flag[@]}"
          fi

